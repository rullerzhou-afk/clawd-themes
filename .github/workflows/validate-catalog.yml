name: validate-catalog

on:
  pull_request:
    paths:
      - "catalog-v1.json"
      - "schemas/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/validate-catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog-v1.json"
      - "schemas/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/validate-catalog.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require catalogVersion bump on pull requests
        if: github.event_name == 'pull_request'
        env:
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-catalog-version.js
      - name: Require catalogVersion bump on pushes
        if: github.event_name == 'push'
        env:
          CATALOG_BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-catalog-version.js
      - run: node scripts/verify-theme-release.js --catalog catalog-v1.json --download
