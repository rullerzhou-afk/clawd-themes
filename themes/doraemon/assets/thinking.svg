<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-bell" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#E5A910"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes floatQuestion {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.95; }
      50% { transform: translateY(-2.2px) scale(1.08); opacity: 0.7; }
    }
    @keyframes chinTap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes thinkingBreath {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.4px); }
    }

    #question-mark {
      animation: floatQuestion 2.2s ease-in-out infinite;
      transform-origin: 15px -14px;
    }
    #arm-thinking {
      animation: chinTap 1.8s ease-in-out infinite;
      transform-origin: 12px 7px;
    }
    #thinking-body {
      animation: thinkingBreath 3.2s ease-in-out infinite;
      transform-origin: 5px 18px;
    }
  </style>

  <!-- 投影层 -->
  <ellipse cx="5" cy="18" rx="10" ry="2.2" fill="rgba(0,0,0,0.14)"/>

  <!-- 尾巴层 -->
  <g id="tail" style="transform-origin: -3px 14px">
    <line x1="0" y1="13" x2="-3" y2="14" stroke="#24292E" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="-3" cy="14" r="1.8" fill="#E63946" stroke="#24292E" stroke-width="0.8"/>
  </g>

  <!-- 主体身体层 -->
  <g id="thinking-body">
    <!-- 脚部 -->
    <g id="feet">
      <ellipse cx="1" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
      <ellipse cx="9" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
    </g>

    <!-- 躯干与肚皮 -->
    <path d="M -2 6 Q -5 12 0 17 L 10 17 Q 15 12 12 6 Z" fill="#0096E6" stroke="#24292E" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 0 7 Q -2 14 5 15 Q 12 14 10 7 Z" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <path d="M 1 10 Q 5 10 9 10 Q 9 14 5 14 Q 1 14 1 10 Z" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>

    <!-- 左臂（自然垂放） -->
    <g id="arm-left">
      <path d="M -2 7 Q -6 9 -6 12" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-6" cy="12" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    </g>

    <!-- 右臂（托下巴沉思） -->
    <g id="arm-thinking">
      <path d="M 12 7 Q 14 4 10 2" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="9.5" cy="1.5" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    </g>

    <!-- 项圈与铃铛 -->
    <rect x="0" y="4.5" width="10" height="2.2" rx="1.1" fill="#E63946" stroke="#24292E" stroke-width="1"/>
    <circle cx="5" cy="7.2" r="1.8" fill="url(#grad-bell)" stroke="#24292E" stroke-width="0.8"/>
    <line x1="3.5" y1="6.8" x2="6.5" y2="6.8" stroke="#B78B20" stroke-width="0.6"/>
    <circle cx="5" cy="7.6" r="0.4" fill="#24292E"/>

    <!-- 头部（微侧仰） -->
    <g id="head" style="transform: rotate(2.5deg); transform-origin: 5px 6px;">
      <circle cx="5" cy="-2" r="12" fill="#0096E6" stroke="#24292E" stroke-width="1.2"/>
      <ellipse cx="5" cy="0" rx="9.8" ry="8.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1.1"/>
      <circle cx="5" cy="-2.8" r="1.6" fill="#E63946" stroke="#24292E" stroke-width="0.9"/>
      <circle cx="4.5" cy="-3.3" r="0.4" fill="#FFFFFF"/>
      <line x1="5" y1="-1.2" x2="5" y2="3.8" stroke="#24292E" stroke-width="0.9"/>

      <g id="whiskers" stroke="#24292E" stroke-width="0.8" stroke-linecap="round">
        <line x1="3" y1="-1.5" x2="-2" y2="-3"/><line x1="3" y1="0" x2="-3" y2="0"/><line x1="3" y1="1.5" x2="-2" y2="3"/>
        <line x1="7" y1="-1.5" x2="12" y2="-3"/><line x1="7" y1="0" x2="13" y2="0"/><line x1="7" y1="1.5" x2="12" y2="3"/>
      </g>

      <!-- 嘴巴：小口微张做沉思状 -->
      <ellipse cx="5" cy="4.5" rx="1.5" ry="2" fill="#F0F4F8" stroke="#24292E" stroke-width="0.9"/>

      <!-- 双眼：视线向斜上方思考凝视 -->
      <ellipse cx="2.6" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
      <ellipse cx="7.4" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
      <circle cx="2.8" cy="-6.5" r="1.1" fill="#1D2125"/>
      <circle cx="3.1" cy="-6.8" r="0.35" fill="#FFFFFF"/>
      <circle cx="7.6" cy="-6.5" r="1.1" fill="#1D2125"/>
      <circle cx="7.9" cy="-6.8" r="0.35" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 浮动问号 -->
  <g id="question-mark">
    <text x="13" y="-12" font-family="-apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFD166" stroke="#24292E" stroke-width="0.6">?</text>
  </g>
</svg>
