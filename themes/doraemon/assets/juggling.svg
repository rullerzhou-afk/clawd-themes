<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-bell" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF275"/><stop offset="100%" stop-color="#E5A910"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes juggle1 {
      0%   { transform: translate(0px, 8px); }
      33%  { transform: translate(5px, -8px); }
      66%  { transform: translate(10px, 8px); }
      100% { transform: translate(0px, 8px); }
    }
    @keyframes juggle2 {
      0%   { transform: translate(10px, 8px); }
      33%  { transform: translate(0px, 8px); }
      66%  { transform: translate(5px, -8px); }
      100% { transform: translate(10px, 8px); }
    }
    @keyframes juggle3 {
      0%   { transform: translate(5px, -8px); }
      33%  { transform: translate(10px, 8px); }
      66%  { transform: translate(0px, 8px); }
      100% { transform: translate(5px, -8px); }
    }
    @keyframes juggleHandL {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes juggleHandR {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(0); }
    }

    #j-ball-1 { animation: juggle1 1.2s ease-in-out infinite; }
    #j-ball-2 { animation: juggle2 1.2s ease-in-out infinite; }
    #j-ball-3 { animation: juggle3 1.2s ease-in-out infinite; }
    #juggle-hand-l { animation: juggleHandL 0.6s ease-in-out infinite; transform-origin: -2px 10px; }
    #juggle-hand-r { animation: juggleHandR 0.6s ease-in-out infinite; transform-origin: 12px 10px; }
  </style>

  <ellipse cx="5" cy="18" rx="10" ry="2.2" fill="rgba(0,0,0,0.12)"/>

  <!-- 身体与四肢 -->
  <g id="body">
    <ellipse cx="1" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
    <ellipse cx="9" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
    <path d="M -2 6 Q -5 12 0 17 L 10 17 Q 15 12 12 6 Z" fill="#0096E6" stroke="#24292E" stroke-width="1.2"/>
    <path d="M 0 7 Q -2 14 5 15 Q 12 14 10 7 Z" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>

    <!-- 杂耍动作双手 -->
    <g id="juggle-hand-l">
      <path d="M -2 7 Q -5 10 -2 12" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-1" cy="11" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    </g>
    <g id="juggle-hand-r">
      <path d="M 12 7 Q 15 10 12 12" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="11" cy="11" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    </g>

    <!-- 项圈与铃铛 -->
    <rect x="0" y="4.5" width="10" height="2.2" rx="1.1" fill="#E63946" stroke="#24292E" stroke-width="1"/>
    <circle cx="5" cy="7.2" r="1.8" fill="url(#grad-bell)" stroke="#24292E" stroke-width="0.8"/>

    <!-- 头部 -->
    <circle cx="5" cy="-2" r="12" fill="#0096E6" stroke="#24292E" stroke-width="1.2"/>
    <ellipse cx="5" cy="0" rx="9.8" ry="8.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1.1"/>
    <circle cx="5" cy="-2.8" r="1.6" fill="#E63946" stroke="#24292E" stroke-width="0.9"/>
    <line x1="5" y1="-1.2" x2="5" y2="3.8" stroke="#24292E" stroke-width="0.9"/>

    <g stroke="#24292E" stroke-width="0.8" stroke-linecap="round">
      <line x1="3" y1="-1.5" x2="-2" y2="-3"/><line x1="3" y1="0" x2="-3" y2="0"/><line x1="3" y1="1.5" x2="-2" y2="3"/>
      <line x1="7" y1="-1.5" x2="12" y2="-3"/><line x1="7" y1="0" x2="13" y2="0"/><line x1="7" y1="1.5" x2="12" y2="3"/>
    </g>

    <!-- 欢快微笑嘴巴 -->
    <path d="M 1 3.5 Q 5 7 9 3.5" fill="none" stroke="#24292E" stroke-width="1" stroke-linecap="round"/>

    <!-- 视线向上看着抛接的彩球 -->
    <ellipse cx="2.6" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <ellipse cx="7.4" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <circle cx="3.2" cy="-6" r="1.1" fill="#1D2125"/>
    <circle cx="6.8" cy="-6" r="1.1" fill="#1D2125"/>
  </g>

  <!-- 3颗空中抛接的彩色道具球 -->
  <g id="j-ball-1">
    <circle cx="0" cy="0" r="2.2" fill="#E63946" stroke="#24292E" stroke-width="0.8"/>
  </g>
  <g id="j-ball-2">
    <circle cx="0" cy="0" r="2.2" fill="#FFD166" stroke="#24292E" stroke-width="0.8"/>
  </g>
  <g id="j-ball-3">
    <circle cx="0" cy="0" r="2.2" fill="#0096E6" stroke="#24292E" stroke-width="0.8"/>
  </g>
</svg>
