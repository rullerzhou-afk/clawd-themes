<svg viewBox="-20 -25 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-bell" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF275"/><stop offset="100%" stop-color="#E5A910"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes nodOff {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(8deg) translateY(2px); }
      75% { transform: rotate(14deg) translateY(4px); }
      82% { transform: rotate(-3deg) translateY(-0.5px); }
    }
    @keyframes zzzFloat {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { transform: translate(4px, -5px) scale(1); opacity: 0.9; }
      100% { transform: translate(8px, -10px) scale(0.7); opacity: 0; }
    }

    #dozing-head {
      animation: nodOff 3.5s ease-in-out infinite;
      transform-origin: 5px 6px;
    }
    .zzz-text {
      animation: zzzFloat 2.5s ease-in-out infinite;
    }
  </style>

  <ellipse cx="5" cy="18" rx="10" ry="2.2" fill="rgba(0,0,0,0.12)"/>

  <!-- 身体与四肢（盘坐） -->
  <g id="body">
    <ellipse cx="1" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
    <ellipse cx="9" cy="17.5" rx="4" ry="1.8" fill="#FFFFFF" stroke="#24292E" stroke-width="1.2"/>
    <path d="M -2 6 Q -5 12 0 17 L 10 17 Q 15 12 12 6 Z" fill="#0096E6" stroke="#24292E" stroke-width="1.2"/>
    <path d="M 0 7 Q -2 14 5 15 Q 12 14 10 7 Z" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <path d="M 1 10 Q 5 10 9 10 Q 9 14 5 14 Q 1 14 1 10 Z" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>

    <!-- 双臂垂在腹前 -->
    <path d="M -2 7 Q 1 10 2 13" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="2" cy="13" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <path d="M 12 7 Q 9 10 8 13" stroke="#0096E6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="8" cy="13" r="2.2" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>

    <!-- 项圈与铃铛 -->
    <rect x="0" y="4.5" width="10" height="2.2" rx="1.1" fill="#E63946" stroke="#24292E" stroke-width="1"/>
    <circle cx="5" cy="7.2" r="1.8" fill="url(#grad-bell)" stroke="#24292E" stroke-width="0.8"/>
  </g>

  <!-- 点头瞌睡的头部 -->
  <g id="dozing-head">
    <circle cx="5" cy="-2" r="12" fill="#0096E6" stroke="#24292E" stroke-width="1.2"/>
    <ellipse cx="5" cy="0" rx="9.8" ry="8.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1.1"/>
    <circle cx="5" cy="-2.8" r="1.6" fill="#E63946" stroke="#24292E" stroke-width="0.9"/>
    <line x1="5" y1="-1.2" x2="5" y2="3" stroke="#24292E" stroke-width="0.9"/>

    <g stroke="#24292E" stroke-width="0.8" stroke-linecap="round">
      <line x1="3" y1="-1.5" x2="-2" y2="-3"/><line x1="3" y1="0" x2="-3" y2="0"/><line x1="3" y1="1.5" x2="-2" y2="3"/>
      <line x1="7" y1="-1.5" x2="12" y2="-3"/><line x1="7" y1="0" x2="13" y2="0"/><line x1="7" y1="1.5" x2="12" y2="3"/>
    </g>

    <!-- 困倦小嘴 -->
    <path d="M 2 4 Q 5 6 8 4" fill="none" stroke="#24292E" stroke-width="1"/>

    <!-- 半耷拉瞌睡眼 (上眼皮下沉) -->
    <ellipse cx="2.6" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <ellipse cx="7.4" cy="-5.2" rx="2.5" ry="3.5" fill="#FFFFFF" stroke="#24292E" stroke-width="1"/>
    <path d="M 0.1 -6.5 Q 2.6 -4 5.1 -6.5" fill="#0096E6" stroke="#24292E" stroke-width="0.8"/>
    <path d="M 4.9 -6.5 Q 7.4 -4 9.9 -6.5" fill="#0096E6" stroke="#24292E" stroke-width="0.8"/>
    <circle cx="2.8" cy="-4.5" r="0.9" fill="#1D2125"/>
    <circle cx="7.6" cy="-4.5" r="0.9" fill="#1D2125"/>
  </g>

  <!-- 浮动 Zzz 符号 -->
  <g class="zzz-text" style="transform-origin: 14px -8px">
    <text x="14" y="-8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="6" fill="#81D4FA">z</text>
  </g>
</svg>
